name: 매일 아침 데이터 업데이트

on:
  schedule:
    - cron: "50 20 * * *"   # 매일 한국시간 오전 5시 50분
  workflow_dispatch: {}      # Actions 탭에서 '지금 실행'도 가능
  push:                      # 코드나 설정(config.json)을 바꿔 올리면 바로 실행
    branches: [main]
    paths-ignore:
      - "data/**"
      - "site/data/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 실거래가 모으기 · 분석하기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          RONE_KEY: ${{ secrets.RONE_KEY }}
          TZ: Asia/Seoul
        run: |
          set +e
          export PYTHONUNBUFFERED=1
          mkdir -p data
          : > data/run.log
          # 실행 기록을 data/run.log 에 남겨요 (인증키는 *** 로 가림)
          step() {
            echo "== $*" | tee -a data/run.log
            "$@" 2>&1 | sed -u "s/${DATA_GO_KR_KEY:-__none__}/***/g" | tee -a data/run.log
            rc=${PIPESTATUS[0]}
            [ $rc -eq 0 ] || echo "!! 실패($rc): $*" | tee -a data/run.log
          }
          if [ -n "$DATA_GO_KR_KEY" ]; then
            step python collector/fetch_molit.py
            step python collector/fetch_kapt.py
            step python collector/fetch_rone.py
            step python collector/build.py
          else
            echo "인증키가 아직 없어 테스트 데이터로 사이트를 만들어요"
            step python collector/make_sample.py
            step python collector/build.py --sample
          fi

      - name: 모은 데이터 저장
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          for p in data/raw data/history data/rone.json data/kapt.json data/run.log site/data; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --cached --quiet || git commit -m "데이터 업데이트 $(TZ=Asia/Seoul date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
